name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

      # Real install on each OS, without login autostart (no user session on CI) and without Claude Code.
      - name: Installation
        run: npm run setup -- --no-autostart --no-claude
      - name: Envoi et relecture d'une note
        shell: bash
        run: |
          echo "## Note envoyée par la CI" | node scripts/board-note.mjs "CI"
          curl -sf http://127.0.0.1:4848/api/notes | grep -q "Note envoyée par la CI"
          node scripts/board-server.mjs status
      - name: Désinstallation
        run: npm run setup:remove

  # Single check to require in the branch protection, whatever the matrix becomes.
  ci-ok:
    name: CI OK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tous les tests sont passés."
